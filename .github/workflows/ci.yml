name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Unit tests (coverage gate 90%)
        run: pytest --cov --cov-report=term-missing

  dogfood:
    name: Check example migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Safe migrations must pass
        run: migration-guard check examples/migrations/safe --fail-on warning
      - name: Risky migrations must be blocked
        run: |
          set +e
          migration-guard check examples/migrations/risky --format github
          code=$?
          test "$code" -eq 1 || { echo "expected exit code 1, got $code"; exit 1; }

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t migration-guard:ci .
      - run: docker run --rm -v "$PWD:/repo" migration-guard:ci check examples/migrations/safe

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "migration-guard"
version = "0.1.0"
description = "A CI check that flags risky database migrations before they reach review."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Koushik Goteti" }]
keywords = ["database", "migrations", "ci", "postgres", "linter", "devops"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: Software Development :: Quality Assurance",
  "Environment :: Console",
]
dependencies = ["tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
migration-guard = "migration_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["migration_guard"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
